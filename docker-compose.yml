# Local development database: plain Postgres (Alpine) behind Neon's local HTTP/WebSocket proxy,
# so the app keeps using @neondatabase/serverless unchanged. No pgvector: RAG search falls back
# to keyword-only (see migrations/006_lms_vector.sql and src/lib/lms/rag.ts).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kaneki
    # Small-footprint settings for a single-developer database.
    command: >
      postgres
      -c shared_buffers=32MB
      -c max_connections=20
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kaneki"]
      interval: 2s
      timeout: 3s
      retries: 15

  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/kaneki
    ports:
      - "4444:4444"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
